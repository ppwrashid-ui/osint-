<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OSINT://TERMINAL</title>
<style>
:root{--bg:#05080d;--pn:#0a1219;--bd:#1b3a45;--c:#aad4df;--ac:#22e5ff;--mu:#5f8793;--ok:#3dffa0;--er:#ff4d6d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--c);font:14px/1.7 ui-monospace,"SF Mono",Menlo,Consolas,monospace;background-image:radial-gradient(circle at 50% 0,#0c2530 0,transparent 60%)}
a{color:var(--ac);text-decoration:none;word-break:break-all}a:hover{text-decoration:underline}
.hide{display:none!important}
#auth{min-height:100vh;display:grid;place-items:center;padding:16px}
.box,.pn{background:var(--pn);border:1px solid var(--bd);position:relative;padding:18px 14px 14px}
.box{width:min(380px,100%)}
.lb{position:absolute;top:-9px;inset-inline-start:12px;background:var(--bg);padding:0 8px;font-size:11px;letter-spacing:2px;color:var(--mu)}
h2{margin:0 0 12px;color:var(--ac);letter-spacing:3px;font-size:16px}
input,select{width:100%;font:inherit;background:var(--bg);color:var(--c);border:1px solid var(--bd);padding:9px 10px;margin:0 0 10px;direction:ltr;text-align:left;border-radius:0}
input:focus,select:focus{outline:1px solid var(--ac)}
button{font:inherit;cursor:pointer;background:transparent;color:var(--ac);border:1px solid var(--ac);padding:7px 12px;border-radius:0}
button:hover{background:var(--ac);color:var(--bg)}button.d{color:var(--er);border-color:var(--er)}button.d:hover{background:var(--er);color:var(--bg)}
.err{color:var(--er);min-height:22px;font-size:13px}
.wrap{max-width:1000px;margin:0 auto;padding:12px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--bd);padding:8px 12px;margin-bottom:14px;background:var(--pn)}
.top b{color:var(--ac);letter-spacing:3px}.top .s{margin-inline-start:auto;display:flex;gap:10px;align-items:center;color:var(--mu);font-size:13px}
nav{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto}
nav button{border-color:var(--bd);color:var(--mu);flex:none}nav button.on{background:var(--c);color:var(--bg);border-color:var(--c)}
#out{height:52vh;min-height:280px;overflow-y:auto;padding:4px 2px;direction:ltr;text-align:left}
#out div{white-space:pre-wrap;word-break:break-word}.m{color:var(--mu)}.g{color:var(--ok)}.r{color:var(--er)}
.pr{display:flex;align-items:center;gap:8px;direction:ltr;border-top:1px solid var(--bd);padding-top:10px;margin-top:8px}
.pr span{color:var(--ok);white-space:nowrap}.pr input{margin:0;border:0;background:transparent;padding:4px}.pr input:focus{outline:0}
.qk{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;direction:ltr}.qk button{padding:3px 9px;font-size:12px;color:var(--c);border-color:var(--bd)}
.card{border:1px solid var(--bd);padding:10px;margin-bottom:10px;background:var(--bg);direction:ltr;text-align:left}
.card b{color:var(--ac)}.card code{display:block;color:var(--ok);margin:4px 0;word-break:break-all;white-space:pre-wrap}
.cp{font-size:12px;padding:2px 8px}
.links{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}.links a{border:1px solid var(--bd);padding:2px 9px;font-size:13px;color:var(--c)}
.tb{width:100%;border-collapse:collapse;direction:ltr;text-align:left;font-size:13px}.tb td,.tb th{border-bottom:1px solid var(--bd);padding:6px 4px}.tb th{color:var(--mu);font-weight:400}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.note{color:var(--mu);font-size:12px;margin-top:14px;text-align:center}
</style>
</head>
<body>
<div id="auth"><div class="box"><span class="lb" id="al">AUTH</span><h2 id="at">LOGIN</h2><div class="m" id="ah" style="font-size:12px;margin-bottom:10px"></div>
<input id="lu" placeholder="username" autocomplete="username"><input id="lp" type="password" placeholder="password" autocomplete="current-password">
<button id="lb" style="width:100%">ENTER</button><div class="err" id="le"></div></div></div>

<div class="wrap hide" id="app">
<div class="top"><b>OSINT://TERMINAL</b><span class="m" id="clk"></span><div class="s"><span id="who"></span><button id="lo">LOGOUT</button></div></div>
<nav id="nv"><button data-t="t" class="on">TERMINAL</button><button data-t="c">CLI TOOLS</button><button data-t="d">FRAMEWORK</button><button data-t="a" id="adt" class="hide">ADMIN</button></nav>

<section id="t" class="pn"><span class="lb">MAIN - OSINT</span><div id="out"></div>
<div class="pr"><span id="ps">$</span><input id="cmd" placeholder="help" autocomplete="off" spellcheck="false"></div><div class="qk" id="qk"></div></section>

<section id="c" class="pn hide"><span class="lb">CLI TOOLS (RUN LOCALLY)</span><input id="tg" placeholder="target: example.com / username / +964…"><div id="cl"></div></section>
<section id="d" class="pn hide"><span class="lb">OSINT FRAMEWORK INDEX</span><input id="f" placeholder="filter…"><div id="dir"></div></section>

<section id="a" class="hide"><div class="g2">
<div class="pn"><span class="lb">USERS</span><div id="ul"></div><input id="nu" placeholder="new username" style="margin-top:10px"><input id="np" type="password" placeholder="password (8+)"><select id="nr"><option value="user">user</option><option value="admin">admin</option></select><button id="au">ADD USER</button><div class="err" id="ue"></div></div>
<div class="pn"><span class="lb">CUSTOM TOOLS</span><div id="ct"></div><select id="ty" style="margin-top:10px"></select><input id="tn" placeholder="tool name"><input id="tu" placeholder="https://site.com/?q={q}"><input id="td" placeholder="description"><button id="at2">ADD TOOL</button><div class="err" id="te"></div></div>
<div class="pn"><span class="lb">ACTIVITY LOG</span><div id="lg" style="max-height:260px;overflow:auto;direction:ltr;text-align:left;font-size:12px"></div><button class="d" id="cl2" style="margin-top:10px">CLEAR LOG</button></div>
<div class="pn"><span class="lb">BACKUP / SECURITY</span><button id="ex">EXPORT JSON</button><hr style="border-color:var(--bd)"><input id="op" type="password" placeholder="current password"><input id="pw" type="password" placeholder="new password (8+)"><button id="cp2">CHANGE MY PASSWORD</button><div class="err" id="pe"></div></div>
</div></section>
<p class="note">AUTHORIZED &amp; LEGAL USE ONLY · الأدوات ترسلك لمصادر عامة · الحسابات والبيانات محفوظة على السيرفر</p>
</div>

<script src="app.js"></script>
</body>
</html>
