services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/osint.db
      - ADMIN_USER=${ADMIN_USER:-}
      - ADMIN_PASS=${ADMIN_PASS:-}
    volumes: [data:/data]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data"]
    depends_on: [app]
volumes: { data: {}, caddy_data: {} }
